{{- if .Values.redeploy.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "destroyer.fullname" . }}
  labels:
    {{- include "destroyer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "destroyer.fullname" . }}
  labels:
    {{- include "destroyer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "destroyer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "destroyer.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "destroyer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "destroyer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ and .Values.serviceAccount.automount .Values.redeploy.enabled }}
{{- end }}
